name: CI

on:
    push:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
        - name: Check out repository
          uses: actions/checkout@v6

        - name: Install uv
          uses: astral-sh/setup-uv@v7

        - name: Install dependencies
          run: uv sync

        - name: Check formatting
          run: uv run ruff format . --check
        
        - name: Linting
          run: uv run ruff check .

        - name: Run tests
          run: uv run pytest